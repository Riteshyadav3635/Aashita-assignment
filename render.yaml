services:
  - type: web
    name: workspace-api
    env: docker
    plan: free
    region: oregon
    rootDir: apps/api
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: APP_NAME
        value: workspace
      - key: APP_VERSION
        value: 0.1.0
      - key: RUN_WORKER
        value: 'true'
