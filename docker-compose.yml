version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: workspace-postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: workspace-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: workspace-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: workspace-api
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://app:app@postgres:5432/app?schema=public
      TEST_DATABASE_URL: postgresql://app:app@postgres:5432/app_test?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      RUN_WORKER: 'true'
      FRONTEND_URL: http://localhost:3000
      API_URL: http://api:4000
      SOCKET_URL: http://localhost:4000
      JWT_SECRET: replace-with-a-real-secret-at-least-32-chars
      JWT_REFRESH_SECRET: replace-with-a-real-refresh-secret-at-least-32-chars
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    container_name: workspace-web
    env_file:
      - .env
    environment:
      API_URL: http://api:4000
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
