name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app -d app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=public
      TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app_test?schema=public
      REDIS_URL: redis://localhost:6379
      SMTP_URL: smtp://localhost:1025
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:4000
      SOCKET_URL: http://localhost:4000
      JWT_ACCESS_SECRET: test-access-secret-key-must-be-32-chars
      JWT_REFRESH_SECRET: test-refresh-secret-key-must-be-32-chars
      APP_NAME: workspace
      APP_VERSION: 0.1.0

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint API code
        run: npm run lint

      - name: Type-check API code
        run: npm run typecheck

      - name: Run API test suite
        run: npm test

  web:
    name: Web checks
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint web app
        run: npm run lint

      - name: Type-check web app
        run: npm run typecheck

      - name: Run web tests if present
        run: npm test --if-present

      - name: Build web app
        run: npm run build

  docker:
    name: Docker build checks
    runs-on: ubuntu-latest
    needs:
      - api
      - web

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile apps/api

      - name: Build web Docker image
        run: docker build -f apps/web/Dockerfile apps/web
